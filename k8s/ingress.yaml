apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: test-server-ingress
  namespace: test-http-server  # Change this to match your Service's namespace
  annotations:
    cert-manager.io/issuer: "letsencrypt-prod"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  rules:
  - host: test-server.raghiba.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: test-service  # Use the simple Service name
            port:
              number: 80
  tls:
  - hosts:
    - test-server.raghiba.com
    secretName: test-server-tls
