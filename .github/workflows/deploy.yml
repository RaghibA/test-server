name: Deploy to K3s

on:
  push:
    branches: [ "main" ] # Or your main development branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: kubernetes-actions/setup-kubectl@v3
        with:
          kubeconfig: ${{ secrets.KUBECONFIG_SECRET }}

      - name: Apply Kubernetes Manifests
        run: |
          kubectl apply -f k8s/deployment.yaml -n default
          kubectl apply -f k8s/service.yaml -n default
          kubectl apply -f k8s/ingress.yaml -n default
