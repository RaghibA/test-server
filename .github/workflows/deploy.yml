name: Deploy to K3s

on:
  push:
    branches: [ "main" ] # Or your main development branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: SSH and Apply Manifests
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.K3S_HOST }}
          username: ${{ secrets.K3S_USER }}
          key: ${{ secrets.K3S_PRIVATE_KEY }}
          port: ${{ secrets.K3S_SSH_PORT }}
          script: |
            kubectl apply -f k8s/deployment.yaml -n default
            kubectl apply -f k8s/service.yaml -n default
            kubectl apply -f k8s/ingress.yaml -n default
